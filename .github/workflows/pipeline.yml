name: History Shorts Pipeline

on:
  schedule:
    - cron: "0 13 * * *"  # run 1 — ~13:00 UTC
    - cron: "0 1 * * *"   # run 2 — ~01:00 UTC (roughly 12h apart, different audience timezones)
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: force a specific topic (leave blank to auto-rotate the queue)"
        required: false
        default: ""
      dry_run:
        description: "Build the video but skip uploading"
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the advanced topic-queue pointer back to the repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        working-directory: src
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python pipeline.py "${{ github.event.inputs.topic }}"

      - name: Persist topic queue pointer
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "history-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/state.json
          git diff --staged --quiet || git commit -m "chore: advance topic queue [skip ci]"
          git push
      - name: Debug - list available Groq models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
